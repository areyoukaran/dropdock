<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>DropDock - Share Files, Text & Media Instantly</title>

    <meta
      name="description"
      content="DropDock lets you share files, text, code, and images with simple auto-expiring links. No signup required."
    />

    <meta name="author" content="DropDock" />

    <meta name="theme-color" content="#f6f3ee" />

    <link rel="canonical" href="https://dropdock.lol/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dropdock.lol/" />
    <meta
      property="og:title"
      content="DropDock - Share Files, Text & Media Instantly"
    />
    <meta
      property="og:description"
      content="Share files, text, code, and images with simple auto-expiring links. No signup required."
    />
    <meta
      property="og:image"
      content="https://dropdock.lol/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="DropDock" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="DropDock - Share Files, Text & Media Instantly"
    />
    <meta
      name="twitter:description"
      content="Share files, text, code, and images with simple auto-expiring links. No signup required."
    />
    <meta
      name="twitter:image"
      content="https://dropdock.lol/og-image.png"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "DropDock",
        "description": "Share files, text, code, and images with simple auto-expiring links. No signup required.",
        "url": "https://dropdock.lol/",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": 0,
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
